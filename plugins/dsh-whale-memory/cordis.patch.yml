# dsh-whale-memory bundle layer: mounted when this package is registered as a
# profile bundle, so a profile gets the entry row without hand-editing
# cordis.patch.yml. A profile-level patch can still disable the row by id.
#
# Install EITHER as a bundle OR as a profile patch row — never both
# (a duplicate id is rejected by the client-modules table).
#
# The plugin entry is index.js (see package.json main/exports).

- insert:
    - id: whale-memory
      name: dsh-whale-memory
